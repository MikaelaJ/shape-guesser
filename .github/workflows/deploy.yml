name: Deploy to one.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Stop before uploading if anything is broken
      - run: pnpm lint
      - run: pnpm build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Uploads dist/ to the shape-guesser folder inside the portfolio's web
      # folder, so the game is served at mikaelajohansson.com/shape-guesser/.
      # The portfolio's own deploy never deletes files, so it leaves this
      # folder alone.
      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            open -u \"$SFTP_USER\",\"$SFTP_PASSWORD\" sftp://$SFTP_HOST;
            mirror --reverse --verbose --parallel=4 dist/ \"$SFTP_REMOTE_DIR/shape-guesser\"
          "
