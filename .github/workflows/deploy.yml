name: Deploy to one.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # No dependency cache: this job holds the SFTP password and uploads
      # to the live site, and setup-node advises against caching in jobs
      # with secrets (a tampered cache could change what's built)
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      # Stop before uploading if anything is broken
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Uploads dist/ to the outlinr folder inside the portfolio's web
      # folder, so the game is served at mikaelajohansson.com/outlinr/.
      # The portfolio's own deploy never deletes files, so it leaves this
      # folder alone.
      # The game used to live at /shape-guesser/: a small page is uploaded
      # there that forwards to the new address, so old links keep working.
      - name: Upload over SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            open -u \"$SFTP_USER\",\"$SFTP_PASSWORD\" sftp://$SFTP_HOST;
            mirror --reverse --verbose --parallel=4 dist/ \"$SFTP_REMOTE_DIR/outlinr\";
            mirror --reverse --verbose redirect/ \"$SFTP_REMOTE_DIR/shape-guesser\"
          "
